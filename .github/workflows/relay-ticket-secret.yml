name: relay-ticket-secret

on:
  push:
    paths:
      - "backend/relay/config.py"
      - "backend/relay/tickets.py"
      - "backend/tests/test_relay_ticket_secret.py"
      - ".github/workflows/relay-ticket-secret.yml"
  pull_request:
    paths:
      - "backend/relay/config.py"
      - "backend/relay/tickets.py"
      - "backend/tests/test_relay_ticket_secret.py"
      - ".github/workflows/relay-ticket-secret.yml"

jobs:
  ticket-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "cryptography>=42" pytest pytest-xdist
      - working-directory: backend
        run: pytest -q tests/test_relay_ticket_secret.py
