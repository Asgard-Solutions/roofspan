name: Roof Takeoff Contract

on:
  push:
    branches:
      - agent/roof-measurement-increment-b-c
    paths:
      - "backend/services/takeoff*.py"
      - "backend/services/measurement_validation.py"
      - "backend/routers/takeoff.py"
      - "backend/schemas_takeoff.py"
      - "backend/takeoff_models.py"
      - "backend/alembic/versions/c8d9e0f1a2b3_takeoff_templates.py"
      - "backend/tests/test_takeoff_core.py"
      - "backend/tests/test_measurement_validation.py"
      - "backend/server.py"
      - "frontend/src/pages/Takeoff.jsx"
      - "frontend/src/App.js"
      - "frontend/src/components/AppShell.jsx"
      - ".github/workflows/roof-takeoff-contract.yml"
  pull_request:
    paths:
      - "backend/services/takeoff*.py"
      - "backend/services/measurement_validation.py"
      - "backend/routers/takeoff.py"
      - "backend/schemas_takeoff.py"
      - "backend/takeoff_models.py"
      - "backend/alembic/versions/c8d9e0f1a2b3_takeoff_templates.py"
      - "frontend/src/pages/Takeoff.jsx"
      - "frontend/src/App.js"
      - "frontend/src/components/AppShell.jsx"
      - ".github/workflows/roof-takeoff-contract.yml"

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner and required repository plugin
        run: python -m pip install --disable-pip-version-check pytest pytest-xdist
      - name: Run deterministic takeoff contracts
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_takeoff_core.py backend/tests/test_measurement_validation.py
      - name: Compile new backend modules
        run: >-
          python -m compileall -q
          backend/services/takeoff_core.py
          backend/services/takeoff.py
          backend/services/measurement_validation.py
          backend/routers/takeoff.py
          backend/schemas_takeoff.py
          backend/takeoff_models.py
          backend/alembic/versions/c8d9e0f1a2b3_takeoff_templates.py
          backend/server.py

  office-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install Office dependencies
        run: yarn install --frozen-lockfile
      - name: Build Office UI
        env:
          CI: "false"
        run: yarn build
