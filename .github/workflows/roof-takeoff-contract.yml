name: Roof Takeoff Contract

on:
  push:
    branches:
      - agent/roof-measurement-full-completion
    paths:
      - "backend/services/takeoff*.py"
      - "backend/services/measurement*.py"
      - "backend/measurement_extension_models.py"
      - "backend/routers/takeoff.py"
      - "backend/schemas_takeoff.py"
      - "backend/schemas_measurements.py"
      - "backend/takeoff_models.py"
      - "backend/models.py"
      - "backend/alembic/versions/c8d9e0f1a2b3_takeoff_templates.py"
      - "backend/alembic/versions/d9e0f1a2b3c4_measurement_completion.py"
      - "backend/tests/test_takeoff_core.py"
      - "backend/tests/test_measurement_validation.py"
      - "backend/tests/test_measurement_completion_core.py"
      - "backend/server.py"
      - "mobile/src/measurementCache.js"
      - "mobile/src/cache.js"
      - "mobile/src/queue.js"
      - "mobile/src/screens/Measurements.js"
      - "mobile/src/tests/measurement_cache.node.test.js"
      - "mobile/src/tests/scope.node.test.js"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "frontend/src/pages/Takeoff.jsx"
      - "frontend/src/components/MeasurementWorksheet.jsx"
      - "frontend/src/App.js"
      - "frontend/src/components/AppShell.jsx"
      - ".github/workflows/roof-takeoff-contract.yml"
  pull_request:
    paths:
      - "backend/services/takeoff*.py"
      - "backend/services/measurement*.py"
      - "backend/measurement_extension_models.py"
      - "backend/routers/takeoff.py"
      - "backend/schemas_takeoff.py"
      - "backend/schemas_measurements.py"
      - "backend/takeoff_models.py"
      - "backend/models.py"
      - "backend/alembic/versions/c8d9e0f1a2b3_takeoff_templates.py"
      - "backend/alembic/versions/d9e0f1a2b3c4_measurement_completion.py"
      - "backend/tests/test_takeoff_core.py"
      - "backend/tests/test_measurement_validation.py"
      - "backend/tests/test_measurement_completion_core.py"
      - "backend/server.py"
      - "mobile/src/measurementCache.js"
      - "mobile/src/cache.js"
      - "mobile/src/queue.js"
      - "mobile/src/screens/Measurements.js"
      - "mobile/src/tests/measurement_cache.node.test.js"
      - "mobile/src/tests/scope.node.test.js"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "frontend/src/pages/Takeoff.jsx"
      - "frontend/src/components/MeasurementWorksheet.jsx"
      - "frontend/src/App.js"
      - "frontend/src/components/AppShell.jsx"
      - ".github/workflows/roof-takeoff-contract.yml"

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner and migration verifier
        run: python -m pip install --disable-pip-version-check pytest pytest-xdist alembic
      - name: Run deterministic roof measurement contracts
        env:
          PYTHONPATH: backend
        run: >-
          pytest -q
          backend/tests/test_takeoff_core.py
          backend/tests/test_measurement_validation.py
          backend/tests/test_measurement_completion_core.py
      - name: Verify Alembic migration graph
        working-directory: backend
        run: |
          heads="$(alembic -c alembic.ini heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          printf '%s\n' "$heads" | grep -q '^d9e0f1a2b3c4 '
      - name: Compile roof measurement backend modules
        run: >-
          python -m compileall -q
          backend/services/takeoff_core.py
          backend/services/takeoff.py
          backend/services/measurement_core.py
          backend/services/measurements.py
          backend/services/measurement_validation.py
          backend/measurement_extension_models.py
          backend/routers/takeoff.py
          backend/schemas_takeoff.py
          backend/schemas_measurements.py
          backend/takeoff_models.py
          backend/models.py
          backend/alembic/versions/c8d9e0f1a2b3_takeoff_templates.py
          backend/alembic/versions/d9e0f1a2b3c4_measurement_completion.py
          backend/server.py

  mobile-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install Field dependencies
        run: npm ci
      - name: Run deterministic Field measurement/offline contracts
        run: npm run test:measurements
      - name: Parse Field measurement modules with Expo Babel
        run: >-
          node -e "const b=require('@babel/core');
          ['src/screens/Measurements.js','src/cache.js','src/queue.js','src/measurementCache.js']
          .forEach(f=>b.transformFileSync(f,{presets:['babel-preset-expo']}));
          console.log('Field measurement modules parsed');"

  office-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install Office dependencies
        run: yarn install --frozen-lockfile
      - name: Build Office UI
        env:
          CI: "false"
        run: yarn build
