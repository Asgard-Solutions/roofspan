name: windows-build-scripts

# Guards the Windows release-engineering scripts so changes cannot silently break the build.
on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-build-scripts.yml"
  pull_request:
    paths:
      - "windows/**"

jobs:
  validate:
    runs-on: ubuntu-latest  # pwsh (PowerShell 7) is preinstalled on GitHub-hosted runners
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Python regression checks (ASCII, spec datas, venv, yarn sync, param contract)
        run: pytest -q windows/tests/test_build_scripts.py

      - name: PowerShell parser validation (real parse of every .ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          Get-ChildItem -Path windows -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch "node_modules" } |
            ForEach-Object {
              $tokens = $null; $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors) {
                $failed = $true
                Write-Host "PARSE ERRORS in $($_.FullName):"
                $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              } else {
                Write-Host "OK  $($_.FullName)"
              }
            }
          if ($failed) { throw "One or more PowerShell scripts failed to parse." }

  # Authoritative Burn-bundle compile: actually runs `wix build bundle.wxs` on Windows with WiX 5.0.2 so
  # schema/compiler regressions (e.g. WIX0010 typed-Variable-without-Value, or a Burn [variable] used as
  # an ExePackage SourceFile) fail CI BEFORE anyone runs the real Windows build.
  bundle-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Install WiX Toolset 5.0.2
        run: dotnet tool install --global wix --version 5.0.2

      - name: Restore pinned WiX 5.0.2 CLI extensions
        run: |
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2

      - name: Real WiX 5 Burn-bundle + MSI compile smoke test
        run: pytest -q windows/tests/test_bundle_compile.py

  # END-TO-END proof that the three RoofSpan-owned executables are REAL Windows SCM services: build the
  # onedir service exes, build the MSI, install it elevated/silently, then assert the services exist,
  # start, the backend actually answers on 127.0.0.1:8001, and they stop cleanly. Compilation alone is
  # NOT accepted. A deterministic PostgreSQL is provisioned so the backend lifespan (migrations) can run;
  # a small stub service named RoofSpanPostgreSQL satisfies the backend's SCM start dependency.
  services-install-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provision PostgreSQL (deterministic)
        id: pg
        uses: ikalnytskyi/action-setup-postgres@v6
        with:
          username: postgres
          password: postgres
          port: "5432"

      - name: Install backend + PyInstaller + pywin32
        run: pip install -r backend/requirements.txt pyinstaller pywin32

      - name: Install WiX Toolset 5.0.2 + extensions
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2

      - name: Build service exes + assemble stage + MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $work = Join-Path $env:RUNNER_TEMP "svc"
          $stage = Join-Path $work "stage"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "frontend"),(Join-Path $stage "runtime"),(Join-Path $stage "config-templates") | Out-Null
          # Real onedir service executables (pywin32-hosted SCM services).
          pwsh -File windows/winbuild/build_exes.ps1 -OutDir (Join-Path $stage "services")
          # Minimal Office UI + a real update public key so the update service has a deterministic key path.
          "<html><body>RoofSpan Office</body></html>" | Set-Content (Join-Path $stage "frontend\index.html")
          "runtime" | Set-Content (Join-Path $stage "runtime\README.txt")
          Copy-Item windows/winbuild/config/* (Join-Path $stage "config-templates") -Recurse -Force
          # Placeholder update-verification PUBLIC key. The update service never reaches key verification
          # in CI (the manifest URL is deliberately unreachable -> a recoverable check failure), but the
          # file must exist so the deterministic key path resolves.
          "-----BEGIN PUBLIC KEY-----`nPLACEHOLDER_CI_ONLY`n-----END PUBLIC KEY-----" | Set-Content (Join-Path $stage "config-templates\update_public_key.pem")
          $msi = Join-Path $work "RoofSpanOffice.msi"
          wix build .\windows\installer\RoofSpan.wxs -arch x64 -d "Version=0.2.0" -d "StageDir=$stage" `
            -ext WixToolset.Util.wixext -ext WixToolset.Firewall.wixext -o $msi
          if (-not (Test-Path $msi)) { throw "MSI did not compile" }
          "MSI=$msi" | Out-File -Append $env:GITHUB_ENV

      - name: Prepare a CLEAN customer machine (Postgres superuser secret + SCM dependency stub only)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # DO NOT create the roofspan role/db and DO NOT write roofspan.env here - RoofSpan's own
          # first-install bootstrap must do all of that. We only reproduce the two things a real clean
          # machine has after the Burn PostgreSQL prerequisite runs:
          #   1) the DPAPI-protected superuser secret at identity\pg_super.bin, and
          #   2) a running Windows service named RoofSpanPostgreSQL (SCM start dependency).
          $id = "C:\ProgramData\RoofSpan\identity"
          New-Item -ItemType Directory -Force -Path $id | Out-Null
          Add-Type -AssemblyName System.Security
          $bytes = [Text.Encoding]::UTF8.GetBytes("postgres")   # == the superuser password set above
          $enc = [Security.Cryptography.ProtectedData]::Protect($bytes, $null, [Security.Cryptography.DataProtectionScope]::LocalMachine)
          [IO.File]::WriteAllBytes((Join-Path $id "pg_super.bin"), $enc)

          $cs = @(
            'using System.ServiceProcess;',
            'public class RsStub : ServiceBase {',
            '  public static void Main() { ServiceBase.Run(new RsStub()); }',
            '  protected override void OnStart(string[] args) { }',
            '  protected override void OnStop() { }',
            '}') -join "`n"
          $src = Join-Path $env:RUNNER_TEMP "pgstub.cs"; Set-Content -Encoding ASCII $src $cs
          $stub = Join-Path $env:RUNNER_TEMP "pgstub.exe"
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:$stub /r:System.ServiceProcess.dll $src
          sc.exe create RoofSpanPostgreSQL binPath= "$stub" start= auto | Out-Null
          Start-Service RoofSpanPostgreSQL

      - name: Install MSI (elevated, silent) and prove the SCM lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "install.log"
          $p = Start-Process msiexec -ArgumentList @("/i","`"$env:MSI`"","/qn","/l*v","`"$log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "MSI install failed ($($p.ExitCode))" }

          $expected = @("RoofSpanBackend","RoofSpanRelayConnector","RoofSpanUpdateService")
          foreach ($s in $expected) {
            if (-not (Get-Service -Name $s -ErrorAction SilentlyContinue)) { throw "service $s was NOT created" }
          }
          Write-Host "OK: all three services exist"

          # Backend must reach Running and actually answer on 127.0.0.1:8001.
          if ((Get-Service RoofSpanBackend).Status -ne "Running") { Start-Service RoofSpanBackend }
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Service RoofSpanBackend).Status -ne "Running" -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          if ((Get-Service RoofSpanBackend).Status -ne "Running") { throw "RoofSpanBackend did not reach Running" }
          $ok = $false
          $deadline = (Get-Date).AddSeconds(60)
          while (-not $ok -and (Get-Date) -lt $deadline) {
            try { $r = Invoke-WebRequest "http://127.0.0.1:8001/api/health" -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true } } catch { Start-Sleep 3 }
          }
          if (-not $ok) { throw "backend did not answer on 127.0.0.1:8001" }
          Write-Host "OK: backend is serving on 127.0.0.1:8001"

          # First-install bootstrap must have CREATED roofspan.env with a REAL generated credential.
          $cfg = "C:\ProgramData\RoofSpan\config\roofspan.env"
          if (-not (Test-Path $cfg)) { throw "first-install bootstrap did not create $cfg" }
          $cfgText = Get-Content $cfg -Raw
          if ($cfgText -match "__GENERATED_AT_FIRST_RUN__") { throw "roofspan.env still contains the placeholder" }
          # Record a HASH of DATABASE_URL (never the secret) so restart/upgrade can prove non-rotation.
          $dbline = (($cfgText -split "`n") | Where-Object { $_ -match "^DATABASE_URL=" })[0].Trim()
          $hash = (Get-FileHash -InputStream ([IO.MemoryStream][Text.Encoding]::UTF8.GetBytes($dbline)) -Algorithm SHA256).Hash
          "DBURL_HASH=$hash" | Out-File -Append $env:GITHUB_ENV
          Write-Host "OK: roofspan.env created by first-install bootstrap (no placeholder, credential generated)"

          # Relay + Update must also be able to enter Running (resilient even with an unreachable relay).
          foreach ($s in @("RoofSpanRelayConnector","RoofSpanUpdateService")) {
            if ((Get-Service $s).Status -ne "Running") { Start-Service $s }
            $d = (Get-Date).AddSeconds(60)
            while ((Get-Service $s).Status -ne "Running" -and (Get-Date) -lt $d) { Start-Sleep 2 }
            if ((Get-Service $s).Status -ne "Running") { throw "$s did not reach Running" }
          }
          Write-Host "OK: relay + update services are Running"

          # Clean SCM stop.
          foreach ($s in $expected) { Stop-Service $s -Force -ErrorAction SilentlyContinue }
          Start-Sleep 5
          foreach ($s in $expected) {
            if ((Get-Service $s).Status -ne "Stopped") { throw "$s did not stop cleanly" }
          }
          Write-Host "OK: all three services stopped cleanly"

      - name: Restart services and prove credentials/data are PRESERVED (idempotent bootstrap)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Start-Service RoofSpanBackend
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Service RoofSpanBackend).Status -ne "Running" -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          if ((Get-Service RoofSpanBackend).Status -ne "Running") { throw "RoofSpanBackend did not restart" }
          # The generated DB credential must be REUSED verbatim (no rotation on restart).
          $dbline = (((Get-Content "C:\ProgramData\RoofSpan\config\roofspan.env" -Raw) -split "`n") | Where-Object { $_ -match "^DATABASE_URL=" })[0].Trim()
          $hash = (Get-FileHash -InputStream ([IO.MemoryStream][Text.Encoding]::UTF8.GetBytes($dbline)) -Algorithm SHA256).Hash
          if ($hash -ne $env:DBURL_HASH) { throw "DB credential was rotated on restart (must be preserved)" }
          $ok = $false; $deadline = (Get-Date).AddSeconds(60)
          while (-not $ok -and (Get-Date) -lt $deadline) { try { if ((Invoke-WebRequest "http://127.0.0.1:8001/api/health" -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { $ok = $true } } catch { Start-Sleep 3 } }
          if (-not $ok) { throw "backend did not serve after restart" }
          Write-Host "OK: restart preserved credentials + backend healthy"

      - name: MSI reinstall/upgrade path preserves the local DB + config (no data destruction)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "reinstall.log"
          # Maintenance reinstall of all features/files - must NOT drop the persisted DB dirs or config.
          $p = Start-Process msiexec -ArgumentList @("/i","`"$env:MSI`"","/qn","REINSTALL=ALL","REINSTALLMODE=vomus","/l*v","`"$log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "MSI reinstall failed ($($p.ExitCode))" }
          $dbline = (((Get-Content "C:\ProgramData\RoofSpan\config\roofspan.env" -Raw) -split "`n") | Where-Object { $_ -match "^DATABASE_URL=" })[0].Trim()
          $hash = (Get-FileHash -InputStream ([IO.MemoryStream][Text.Encoding]::UTF8.GetBytes($dbline)) -Algorithm SHA256).Hash
          if ($hash -ne $env:DBURL_HASH) { throw "upgrade/reinstall rotated or destroyed the DB credential" }
          foreach ($s in @("RoofSpanBackend","RoofSpanRelayConnector","RoofSpanUpdateService")) {
            $d = (Get-Date).AddSeconds(90)
            while ((Get-Service $s).Status -ne "Running" -and (Get-Date) -lt $d) { Start-Sleep 2 }
            if ((Get-Service $s).Status -ne "Running") { throw "$s not Running after reinstall" }
          }
          Write-Host "OK: reinstall/upgrade preserved DB credentials + config; all services Running"

      - name: Dump service + install logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "C:\ProgramData\RoofSpan\logs" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="; Get-Content $_.FullName -Tail 120
          }
          if (Test-Path (Join-Path $env:RUNNER_TEMP "install.log")) {
            Write-Host "===== install.log (tail) ====="; Get-Content (Join-Path $env:RUNNER_TEMP "install.log") -Tail 120
          }

