name: windows-build-scripts

# Guards the Windows release-engineering scripts so changes cannot silently break the build.
on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-build-scripts.yml"
  pull_request:
    paths:
      - "windows/**"

jobs:
  db-bootstrap-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: superpw123
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest asyncpg
      - name: REAL PostgreSQL bootstrap test (CREATE + ALTER branches against a live server)
        env:
          ROOFSPAN_TEST_PG_DSN: postgresql://postgres:superpw123@127.0.0.1:5432/postgres
        run: pytest -q windows/tests/test_db_bootstrap_integration.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Python regression checks (ASCII, specs, venv, yarn, release contract)
        run: |
          pytest -q windows/tests/test_build_scripts.py
          pytest -q windows/tests/test_relay_connector_release_contract.py

      - name: PowerShell parser validation (real parse of every .ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $failed = $false
          Get-ChildItem -Path windows -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch "node_modules" } |
            ForEach-Object {
              $tokens = $null; $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors) {
                $failed = $true
                Write-Host "PARSE ERRORS in $($_.FullName):"
                $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              } else {
                Write-Host "OK  $($_.FullName)"
              }
            }
          if ($failed) { throw "One or more PowerShell scripts failed to parse." }

  # Authoritative Burn-bundle compile on Windows with WiX 5.0.2.
  bundle-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Install WiX Toolset 5.0.2
        run: dotnet tool install --global wix --version 5.0.2

      - name: Restore pinned WiX 5.0.2 CLI extensions
        run: |
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2

      - name: Real WiX 5 Burn-bundle + MSI compile smoke test
        run: pytest -q windows/tests/test_bundle_compile.py

      - name: Prerequisites are embedded and RoofSpanSetup.exe is self-contained
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content windows/VERSION -Raw).Trim()
          $work = Join-Path $env:RUNNER_TEMP "bundlepayload"
          $src  = Join-Path $work "src"
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          $edb = Join-Path $src "postgres-edb.exe"
          $wv  = Join-Path $src "webview2setup.exe"

          # Build a real minimal MSI for the MsiPackage using the checked-in release version.
          $wxs = Join-Path $work "dummy.wxs"
          $xml = '<Wix xmlns="http://wixtoolset.org/schemas/v4/wxs"><Package Name="RoofSpan Dummy" Manufacturer="RoofSpan" Version="{0}" UpgradeCode="11111111-1111-1111-1111-111111111111" Scope="perMachine" Compressed="yes"><MediaTemplate EmbedCab="yes" /><StandardDirectory Id="ProgramFiles64Folder"><Directory Id="APPDIR" Name="RoofSpanDummy"><Component Id="C1" Guid="22222222-2222-2222-2222-222222222222"><RegistryValue Root="HKLM" Key="Software\RoofSpanDummy" Name="v" Type="string" Value="1" KeyPath="yes" /></Component></Directory></StandardDirectory><Feature Id="F"><ComponentRef Id="C1" /></Feature></Package></Wix>' -f $version
          Set-Content -Encoding UTF8 -Path $wxs -Value $xml
          $msi = Join-Path $src "RoofSpanOffice.msi"
          wix build $wxs -arch x64 -o $msi

          # Use two DIFFERENT incompressible payloads. Reusing the same bytes lets Burn deduplicate them
          # and makes the bundle-size assertion meaningless.
          $edbBuf = New-Object byte[] (5MB)
          $wvBuf = New-Object byte[] (5MB)
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($edbBuf)
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($wvBuf)
          [IO.File]::WriteAllBytes($edb, $edbBuf)
          [IO.File]::WriteAllBytes($wv, $wvBuf)

          $setup = Join-Path $work "RoofSpanSetup.exe"
          wix build .\windows\installer\bundle.wxs -arch x64 -d "Version=$version" `
            -d "MsiPath=$msi" -d "PostgresInstaller=$edb" -d "WebView2Bootstrapper=$wv" `
            -ext WixToolset.BootstrapperApplications.wixext -ext WixToolset.Util.wixext -o $setup
          if (-not (Test-Path $setup)) { throw "RoofSpanSetup.exe did not build" }

          $setupMB = [math]::Round((Get-Item $setup).Length/1MB, 1)
          $msiMB   = [math]::Round((Get-Item $msi).Length/1MB, 1)
          Write-Host "setup=$setupMB MB  msi=$msiMB MB"
          if (($setupMB - $msiMB) -lt 9) { throw "setup does not appear to carry both embedded prerequisites (delta $($setupMB-$msiMB) MB)" }

          # Prove self-containment: copy only setup, remove source payloads, then extract Burn manifest.
          $iso = Join-Path $work "isolated"; New-Item -ItemType Directory -Force -Path $iso | Out-Null
          Copy-Item $setup (Join-Path $iso "RoofSpanSetup.exe")
          Remove-Item $edb, $wv, $msi -Force
          $ba = Join-Path $work "ba"; $ac = Join-Path $work "ac"
          wix burn extract (Join-Path $iso "RoofSpanSetup.exe") -out $ac -outba $ba
          $manifest = Get-ChildItem $ba -Recurse -Filter *.xml | Select-Object -First 1
          if (-not $manifest) { throw "burn manifest not found after extract" }
          $m = Get-Content $manifest.FullName -Raw
          foreach ($name in @("postgres-edb.exe","webview2setup.exe","RoofSpanOffice.msi")) {
            if ($m -notmatch [regex]::Escape($name)) { throw "payload $name missing from the embedded bundle manifest" }
          }
          if ($m -match 'Packaging="external"') { throw "a prerequisite is an external payload" }
          Write-Host "OK: PostgreSQL + WebView2 + MSI are embedded; setup is self-contained"

  # Build actual PyInstaller services, install the MSI, and prove SCM + upgrade behavior.
  services-install-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provision PostgreSQL (deterministic)
        id: pg
        uses: ikalnytskyi/action-setup-postgres@v6
        with:
          username: postgres
          password: postgres
          port: "5432"

      - name: Install backend + PyInstaller + pywin32
        run: pip install -r backend/requirements.txt pyinstaller pywin32

      - name: Install WiX Toolset 5.0.2 + extensions
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2

      - name: Build service exes + assemble stage + MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content windows/VERSION -Raw).Trim()
          $work = Join-Path $env:RUNNER_TEMP "svc"
          $stage = Join-Path $work "stage"
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $stage "frontend"), `
            (Join-Path $stage "runtime"), `
            (Join-Path $stage "config-templates"), `
            (Join-Path $stage "shell") | Out-Null

          # Real onedir service executables (pywin32-hosted SCM services).
          pwsh -File windows/winbuild/build_exes.ps1 -OutDir (Join-Path $stage "services")

          # Complete minimum Office payload required by the actual MSI authoring.
          "<html><body>RoofSpan Office</body></html>" | Set-Content (Join-Path $stage "frontend\index.html")
          "runtime" | Set-Content (Join-Path $stage "runtime\README.txt")
          Copy-Item "$env:WINDIR\System32\where.exe" (Join-Path $stage "shell\RoofSpanOffice.exe")
          Add-Type -AssemblyName System.Drawing
          $iconStream = [IO.File]::Create((Join-Path $stage "runtime\RoofSpan.ico"))
          try { [System.Drawing.SystemIcons]::Application.Save($iconStream) } finally { $iconStream.Dispose() }
          Copy-Item windows/winbuild/config/* (Join-Path $stage "config-templates") -Recurse -Force
          "-----BEGIN PUBLIC KEY-----`nPLACEHOLDER_CI_ONLY`n-----END PUBLIC KEY-----" | Set-Content (Join-Path $stage "config-templates\update_public_key.pem")

          $msi = Join-Path $work "RoofSpanOffice.msi"
          wix build .\windows\installer\RoofSpan.wxs -arch x64 -d "Version=$version" -d "StageDir=$stage" `
            -ext WixToolset.Util.wixext -ext WixToolset.Firewall.wixext -o $msi
          if (-not (Test-Path $msi)) { throw "MSI did not compile" }
          "MSI=$msi" | Out-File -Append $env:GITHUB_ENV
          "RELEASE_VERSION=$version" | Out-File -Append $env:GITHUB_ENV

      - name: Prepare a clean customer machine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $id = "C:\ProgramData\RoofSpan\identity"
          New-Item -ItemType Directory -Force -Path $id | Out-Null
          Add-Type -AssemblyName System.Security
          $bytes = [Text.Encoding]::UTF8.GetBytes("postgres")
          $enc = [Security.Cryptography.ProtectedData]::Protect($bytes, $null, [Security.Cryptography.DataProtectionScope]::LocalMachine)
          [IO.File]::WriteAllBytes((Join-Path $id "pg_super.bin"), $enc)

          $cs = @(
            'using System.ServiceProcess;',
            'public class RsStub : ServiceBase {',
            '  public static void Main() { ServiceBase.Run(new RsStub()); }',
            '  protected override void OnStart(string[] args) { }',
            '  protected override void OnStop() { }',
            '}') -join "`n"
          $src = Join-Path $env:RUNNER_TEMP "pgstub.cs"; Set-Content -Encoding ASCII $src $cs
          $stub = Join-Path $env:RUNNER_TEMP "pgstub.exe"
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:$stub /r:System.ServiceProcess.dll $src
          sc.exe create RoofSpanPostgreSQL binPath= "$stub" start= auto | Out-Null
          Start-Service RoofSpanPostgreSQL

      - name: Install MSI and prove the SCM lifecycle + Relay contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "install.log"
          $p = Start-Process msiexec -ArgumentList @("/i","`"$env:MSI`"","/qn","/l*v","`"$log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "MSI install failed ($($p.ExitCode))" }

          $expected = @("RoofSpanBackend","RoofSpanRelayConnector","RoofSpanUpdateService")
          foreach ($s in $expected) {
            if (-not (Get-Service -Name $s -ErrorAction SilentlyContinue)) { throw "service $s was not created" }
          }
          Write-Host "OK: all three services exist"

          # The installed relay binary itself must identify the exact source/version and v2 contract.
          $relayExe = "C:\Program Files\RoofSpan Office\services\roofspan-relay-connector\roofspan-relay-connector.exe"
          $infoLine = @(& $relayExe --build-info) | Where-Object { $_ -match '^\s*\{' } | Select-Object -Last 1
          if (-not $infoLine) { throw "installed Relay connector does not expose build-info" }
          $info = $infoLine | ConvertFrom-Json
          if ($info.build_sha -ne "${{ github.sha }}") { throw "installed Relay connector SHA mismatch: $($info.build_sha)" }
          if ($info.version -ne $env:RELEASE_VERSION) { throw "installed Relay connector version mismatch: $($info.version)" }
          if ($info.contract -ne "hosted-installation-identity-v2") { throw "installed Relay connector contract mismatch: $($info.contract)" }
          if ($info.identity_endpoint -ne "/api/relay/connector/identity" -or $info.installation_relay_path -ne "/api/relay/installation") {
            throw "installed Relay connector route contract is stale"
          }
          Write-Host "OK: installed Relay connector SHA/version/contract verified"

          if ((Get-Service RoofSpanBackend).Status -ne "Running") { Start-Service RoofSpanBackend }
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Service RoofSpanBackend).Status -ne "Running" -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          if ((Get-Service RoofSpanBackend).Status -ne "Running") { throw "RoofSpanBackend did not reach Running" }
          $ok = $false
          $deadline = (Get-Date).AddSeconds(60)
          while (-not $ok -and (Get-Date) -lt $deadline) {
            try { $r = Invoke-WebRequest "http://127.0.0.1:8001/api/health" -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true } } catch { Start-Sleep 3 }
          }
          if (-not $ok) { throw "backend did not answer on 127.0.0.1:8001" }
          Write-Host "OK: backend is serving on 127.0.0.1:8001"

          $cfg = "C:\ProgramData\RoofSpan\config\roofspan.env"
          if (-not (Test-Path $cfg)) { throw "first-install bootstrap did not create $cfg" }
          $cfgText = Get-Content $cfg -Raw
          if ($cfgText -match "__GENERATED_AT_FIRST_RUN__") { throw "roofspan.env still contains the placeholder" }
          $dbline = (($cfgText -split "`n") | Where-Object { $_ -match "^DATABASE_URL=" })[0].Trim()
          $hash = (Get-FileHash -InputStream ([IO.MemoryStream][Text.Encoding]::UTF8.GetBytes($dbline)) -Algorithm SHA256).Hash
          "DBURL_HASH=$hash" | Out-File -Append $env:GITHUB_ENV
          Write-Host "OK: roofspan.env created by first-install bootstrap"

          foreach ($s in @("RoofSpanRelayConnector","RoofSpanUpdateService")) {
            if ((Get-Service $s).Status -ne "Running") { Start-Service $s }
            $d = (Get-Date).AddSeconds(60)
            while ((Get-Service $s).Status -ne "Running" -and (Get-Date) -lt $d) { Start-Sleep 2 }
            if ((Get-Service $s).Status -ne "Running") { throw "$s did not reach Running" }
          }
          Write-Host "OK: relay + update services are Running"

          foreach ($s in $expected) { Stop-Service $s -Force -ErrorAction SilentlyContinue }
          Start-Sleep 5
          foreach ($s in $expected) {
            if ((Get-Service $s).Status -ne "Stopped") { throw "$s did not stop cleanly" }
          }
          Write-Host "OK: all three services stopped cleanly"

      - name: Restart services and prove credentials are preserved
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Start-Service RoofSpanBackend
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Service RoofSpanBackend).Status -ne "Running" -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          if ((Get-Service RoofSpanBackend).Status -ne "Running") { throw "RoofSpanBackend did not restart" }
          $dbline = (((Get-Content "C:\ProgramData\RoofSpan\config\roofspan.env" -Raw) -split "`n") | Where-Object { $_ -match "^DATABASE_URL=" })[0].Trim()
          $hash = (Get-FileHash -InputStream ([IO.MemoryStream][Text.Encoding]::UTF8.GetBytes($dbline)) -Algorithm SHA256).Hash
          if ($hash -ne $env:DBURL_HASH) { throw "DB credential was rotated on restart" }
          $ok = $false; $deadline = (Get-Date).AddSeconds(60)
          while (-not $ok -and (Get-Date) -lt $deadline) { try { if ((Invoke-WebRequest "http://127.0.0.1:8001/api/health" -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { $ok = $true } } catch { Start-Sleep 3 } }
          if (-not $ok) { throw "backend did not serve after restart" }
          Write-Host "OK: restart preserved credentials + backend healthy"

      - name: MSI reinstall path preserves DB + config and Relay contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "reinstall.log"
          $p = Start-Process msiexec -ArgumentList @("/i","`"$env:MSI`"","/qn","REINSTALL=ALL","REINSTALLMODE=vomus","/l*v","`"$log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "MSI reinstall failed ($($p.ExitCode))" }
          $dbline = (((Get-Content "C:\ProgramData\RoofSpan\config\roofspan.env" -Raw) -split "`n") | Where-Object { $_ -match "^DATABASE_URL=" })[0].Trim()
          $hash = (Get-FileHash -InputStream ([IO.MemoryStream][Text.Encoding]::UTF8.GetBytes($dbline)) -Algorithm SHA256).Hash
          if ($hash -ne $env:DBURL_HASH) { throw "upgrade/reinstall rotated or destroyed the DB credential" }
          $relayExe = "C:\Program Files\RoofSpan Office\services\roofspan-relay-connector\roofspan-relay-connector.exe"
          $info = (@(& $relayExe --build-info) | Where-Object { $_ -match '^\s*\{' } | Select-Object -Last 1) | ConvertFrom-Json
          if ($info.build_sha -ne "${{ github.sha }}" -or $info.contract -ne "hosted-installation-identity-v2") {
            throw "upgrade/reinstall left a stale Relay connector"
          }
          foreach ($s in @("RoofSpanBackend","RoofSpanRelayConnector","RoofSpanUpdateService")) {
            $d = (Get-Date).AddSeconds(90)
            while ((Get-Service $s).Status -ne "Running" -and (Get-Date) -lt $d) { Start-Sleep 2 }
            if ((Get-Service $s).Status -ne "Running") { throw "$s not Running after reinstall" }
          }
          Write-Host "OK: reinstall preserved data and retained the current Relay contract"

      - name: A failed startup surfaces the real exception without leaking a secret
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cfg = "C:\ProgramData\RoofSpan\config\roofspan.env"
          $orig = Get-Content $cfg -Raw
          Stop-Service RoofSpanBackend -Force -ErrorAction SilentlyContinue
          Start-Sleep 3
          $bad = [regex]::Replace($orig, 'roofspan:[^@]+@', 'roofspan:WRONGPASSWORD_INJECTED@')
          Set-Content -Encoding ASCII -Path $cfg -Value $bad
          Clear-Content "C:\ProgramData\RoofSpan\logs\backend-service.log" -ErrorAction SilentlyContinue
          try { Start-Service RoofSpanBackend -ErrorAction Stop } catch { }
          Start-Sleep 20
          $running = (Get-Service RoofSpanBackend).Status -eq "Running"
          $serviceLog = ""
          if (Test-Path "C:\ProgramData\RoofSpan\logs\backend-service.log") { $serviceLog = Get-Content "C:\ProgramData\RoofSpan\logs\backend-service.log" -Raw }
          Stop-Service RoofSpanBackend -Force -ErrorAction SilentlyContinue
          Set-Content -Encoding ASCII -Path $cfg -Value $orig
          Start-Service RoofSpanBackend -ErrorAction SilentlyContinue
          if ($running) { throw "backend wrongly reached Running with an invalid DB password" }
          if ($serviceLog -notmatch 'password|authentication|InvalidPassword|startup failed|Traceback') {
            throw "backend-service.log did not surface the startup exception:`n$serviceLog"
          }
          if ($serviceLog -match 'WRONGPASSWORD_INJECTED') { throw "secret leak: injected password appears in log" }
          Write-Host "OK: failed startup surfaced the real exception without leaking the credential"

      - name: Dump service + install logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "C:\ProgramData\RoofSpan\logs" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="; Get-Content $_.FullName -Tail 120
          }
          if (Test-Path (Join-Path $env:RUNNER_TEMP "install.log")) {
            Write-Host "===== install.log (tail) ====="; Get-Content (Join-Path $env:RUNNER_TEMP "install.log") -Tail 120
          }
