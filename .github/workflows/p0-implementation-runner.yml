name: P0 implementation runner

on:
  push:
    branches:
      - fix/p0-measurement-sync-hardening-20260906
    paths:
      - "tools/p0_apply.py"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Apply current P0 production change and run its focused verification
        run: python tools/p0_apply.py
      - name: Validate resulting diff
        run: |
          git diff --check
          git status --short
      - name: Commit verified implementation
        run: |
          git config user.name "RoofSpan P0 Bot"
          git config user.email "actions@roofspan.io"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes were produced."
            exit 1
          fi
          git commit -m "$(cat /tmp/p0_commit_message)"
          git push origin HEAD:${GITHUB_REF_NAME}
