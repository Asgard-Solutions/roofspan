name: P0 implementation runner

on:
  push:
    branches:
      - fix/p0-measurement-sync-hardening-20260906
    paths:
      - "tools/p0_apply.py"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roofspan
          POSTGRES_PASSWORD: roofspan
          POSTGRES_DB: roofspan_p0_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roofspan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+asyncpg://roofspan:roofspan@127.0.0.1:5432/roofspan_p0_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Apply current P0 production change and run its focused verification
        run: python tools/p0_apply.py
      - name: Validate resulting diff
        run: |
          git diff --check
          git status --short
      - name: Commit verified implementation
        run: |
          git config user.name "RoofSpan P0 Bot"
          git config user.email "actions@roofspan.io"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes were produced."
            exit 1
          fi
          git commit -m "$(cat /tmp/p0_commit_message)"
          git push origin HEAD:${GITHUB_REF_NAME}
