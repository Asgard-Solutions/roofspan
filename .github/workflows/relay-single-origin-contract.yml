name: bootstrap-relay-single-origin

on:
  push:
    branches:
      - fix/relay-single-authority
    paths:
      - "tools/apply_relay_single_origin.py"
      - ".github/workflows/relay-single-origin-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/relay-single-authority
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical Relay origin and compatibility rewrites
        run: python tools/apply_relay_single_origin.py
      - name: Validate generated patch
        run: |
          python tools/apply_relay_single_origin.py --check
          git diff --check
      - name: Commit generated correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use one hosted origin for Control Plane and Relay"
          git push origin HEAD:fix/relay-single-authority
