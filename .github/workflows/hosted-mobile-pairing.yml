name: hosted-mobile-pairing

on:
  push:
    paths:
      - "backend/control_plane/**"
      - "backend/licensing/config.py"
      - "backend/licensing/pairing_client.py"
      - "backend/server.py"
      - "backend/cp_asgi.py"
      - "backend/tests/test_hosted_pairing_client.py"
      - "backend/tests/hosted_pairing_probe.py"
      - "frontend/src/pages/admin/Users.jsx"
      - "mobile/**"
      - ".github/workflows/hosted-mobile-pairing.yml"
  pull_request:
    paths:
      - "backend/control_plane/**"
      - "backend/licensing/config.py"
      - "backend/licensing/pairing_client.py"
      - "backend/server.py"
      - "backend/cp_asgi.py"
      - "backend/tests/test_hosted_pairing_client.py"
      - "backend/tests/hosted_pairing_probe.py"
      - "frontend/src/pages/admin/Users.jsx"
      - "mobile/**"
      - ".github/workflows/hosted-mobile-pairing.yml"
  workflow_dispatch:

jobs:
  unit-and-client-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install focused backend dependencies and Yarn 1
        run: |
          pip install pytest pytest-xdist sqlalchemy==2.0.50 asyncpg psycopg[binary] \
            fastapi==0.110.1 httpx cryptography python-dotenv pydantic \
            qrcode pillow PyJWT passlib bcrypt alembic
          npm install --global yarn@1.22.22

      - name: Run Office hosted-pairing unit tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://roofspan:test@127.0.0.1:5432/roofspan
          CONTROL_PLANE_BASE_URL: https://cp.roofspan.io
        run: pytest -q -n 0 backend/tests/test_hosted_pairing_client.py

      - name: Compile changed backend modules
        run: |
          python -m py_compile \
            backend/control_plane/installation_router.py \
            backend/licensing/config.py \
            backend/licensing/pairing_client.py \
            backend/server.py \
            backend/cp_asgi.py \
            backend/tests/hosted_pairing_probe.py

      - name: Build RoofSpan Office frontend with QR UI
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Validate RoofSpan Mobile pairing configuration and helpers
        working-directory: mobile
        run: |
          npm ci
          npm run test:pairing
          npx expo config --type public > /tmp/roofspan-expo-config.json
          grep -q 'cp.roofspan.io' /tmp/roofspan-expo-config.json
          grep -q 'relay.roofspan.io' /tmp/roofspan-expo-config.json

      - name: Assert the obsolete split-Control-Plane behavior cannot return
        run: |
          ! grep -q 'INTERNAL_CP_BASE =.*localhost' backend/licensing/pairing_client.py
          grep -q 'CONTROL_PLANE_BASE_URL' backend/licensing/pairing_client.py
          grep -q 'pairing-qr-code' frontend/src/pages/admin/Users.jsx
          grep -q 'installation/register' backend/licensing/pairing_client.py
          grep -q 'revoke-self' backend/licensing/pairing_client.py

  hosted-control-plane-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Control Plane runtime dependencies
        run: pip install -r backend/requirements.txt

      - name: Start disposable hosted Control Plane
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
          CONTROL_PLANE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/roofspan_control_plane
          CP_ENV: dev
          ENTITLEMENT_SIGNER: local
          CP_DEV_BOOTSTRAP_SECRET: dev-bootstrap-roofspan
          CP_DEV_SIGNING_KEYS_DIR: /tmp/roofspan-cp-keys
          ROOFSPAN_RELAY_ENDPOINT: wss://relay.roofspan.io
        run: |
          mkdir -p /tmp/roofspan-cp-keys
          python -m uvicorn cp_asgi:app --app-dir backend --host 127.0.0.1 --port 8765 > /tmp/roofspan-cp.log 2>&1 &
          echo $! > /tmp/roofspan-cp.pid

      - name: Prove register/status/QR-code resolve/user binding/revoke
        env:
          PYTHONPATH: backend
          CP_PROBE_BASE_URL: http://127.0.0.1:8765
          CP_DEV_BOOTSTRAP_SECRET: dev-bootstrap-roofspan
        run: |
          if ! python backend/tests/hosted_pairing_probe.py; then
            cat /tmp/roofspan-cp.log
            exit 1
          fi

      - name: Stop disposable Control Plane
        if: always()
        run: |
          if [ -f /tmp/roofspan-cp.pid ]; then kill "$(cat /tmp/roofspan-cp.pid)" || true; fi
          tail -n 120 /tmp/roofspan-cp.log || true
